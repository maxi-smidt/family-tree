# Family Tree — full web application stack.
#
# Configure via a .env file next to this one (see .env.example). The three
# headline settings requested for deployment:
#   UI_PORT        host port the web UI is served on
#   APP_DATA_PATH  host path for application data (Postgres + backend appdata)
#   DATA_PATH      host path for the "real" data (member photos, gallery media)

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familytree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familytree}
      POSTGRES_DB: ${POSTGRES_DB:-familytree}
      # Postgres 18's image moved the default data dir to a versioned path; pin
      # it back so the bind mount below keeps persisting the data.
      PGDATA: /var/lib/postgresql/data
    ports:
      # Published on localhost only, so during development you can `up -d db`
      # (e.g. from PyCharm) and have a host-run backend reach it. In production
      # the backend talks to the db over the internal network, not this port —
      # remove it if you don't want host access to the database.
      - "127.0.0.1:5432:5432"
    volumes:
      - ${APP_DATA_PATH:-./appdata}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familytree}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-familytree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familytree}
      POSTGRES_DB: ${POSTGRES_DB:-familytree}
      DATA_PATH: /data
      APP_DATA_PATH: /appdata
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${UI_PORT:-8080}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${UI_PORT:-8080}}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-admin}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?Set FIRST_ADMIN_PASSWORD in your .env}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@example.com}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_DISCOVERY_URL: ${AUTHENTIK_DISCOVERY_URL:-}
      AUTHENTIK_ADMIN_GROUP: ${AUTHENTIK_ADMIN_GROUP:-family-tree-admins}
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${APP_DATA_PATH:-./appdata}/backend:/appdata
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${UI_PORT:-8080}:80"
    restart: unless-stopped
