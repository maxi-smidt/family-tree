[project]
name = "family-tree-backend"
version = "1.8.0"
description = "FastAPI backend for the Family Tree web application"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.19.1",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "pyjwt>=2.10.1",
    "bcrypt>=4.2.1",
    "authlib>=1.4.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "cryptography>=50.0.0",
    "email-validator>=2.2.0",
    "pillow>=12.3.0",
    "pyotp>=2.10.0",
    "qrcode[pil]>=8.2",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "httpx2>=2.10.0",
    "pytest-xdist>=3.8.0",
]

# This is an application, not a distributable package — uv installs the
# dependencies into a virtualenv without trying to build the project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), isort (I), flake8-bugbear (B),
# pyupgrade (UP). Matches the conventions already used in the codebase.
select = ["E", "W", "F", "I", "B", "UP"]
# B008: FastAPI's `Depends(...)` / `Query(...)` defaults are the framework's
# intended dependency-injection idiom, not an accidental shared mutable.
ignore = ["B008"]

[tool.ruff.lint.isort]
# The local ``alembic/`` migrations dir makes ruff treat the installed
# ``alembic`` package as first-party; correct that so imports group sensibly.
known-third-party = ["alembic"]
