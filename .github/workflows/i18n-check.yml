name: "Check i18n"

on:
  pull_request:
    branches:
      - main

jobs:
  check-i18n:
    name: "Check for Missing i18n Keys"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm install

      - name: "Run i18n Check"
        run: npm run check-i18n
