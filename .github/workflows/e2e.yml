name: E2E

on:
  pull_request:
    branches:
      - main
    # Skip the (expensive) full-stack run for changes that can't affect it,
    # e.g. docs-only PRs. Safe to gate at the workflow level because E2E is
    # not a required check.
    paths:
      - "frontend/**"
      - "backend/**"
      - "e2e/**"
      - "docker-compose.e2e.yml"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/check-build.yml"
      - ".github/workflows/release-e2e.yml"
  workflow_dispatch:

# Day-to-day PRs run E2E alongside CI when app/test-stack files change. Release
# tags are gated inside check-build.yml so images are not published unless the
# same Playwright suite passes.

permissions:
  contents: read

# A new push to a PR cancels the previous, still-running E2E build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: "Playwright E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      E2E_ADMIN_USERNAME: e2e-admin
      E2E_ADMIN_PASSWORD: e2e-admin-password
      E2E_BASE_URL: http://localhost:8080
      E2E_API_URL: http://localhost:8080/api

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # The stack build is the slowest step, so it runs in the background
      # while the test runner and its browser install alongside it.
      - name: "Start building the compose stack"
        run: |
          (
            docker compose -f docker-compose.e2e.yml up --build -d \
              > "$RUNNER_TEMP/compose-up.log" 2>&1
            echo $? > "$RUNNER_TEMP/compose-up.exit"
          ) &
        env:
          E2E_ADMIN_USERNAME: ${{ env.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: "Install dependencies"
        working-directory: e2e
        run: npm ci

      - name: "Read Playwright version"
        id: playwright
        working-directory: e2e
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: "Cache Playwright browsers"
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: "Install Playwright browsers"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: "Install Playwright system dependencies"
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: "Wait for stack to be healthy"
        run: |
          echo "Waiting for the stack build to finish..."
          for i in $(seq 1 120); do
            [ -f "$RUNNER_TEMP/compose-up.exit" ] && break
            sleep 5
          done
          cat "$RUNNER_TEMP/compose-up.log"
          if [ "$(cat "$RUNNER_TEMP/compose-up.exit" 2>/dev/null)" != "0" ]; then
            echo "Compose stack failed to build or start"
            docker compose -f docker-compose.e2e.yml logs
            exit 1
          fi
          echo "Waiting for frontend to be reachable..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Stack is up after ${i} attempts"
              break
            fi
            echo "  attempt $i/30 — waiting 5s"
            sleep 5
          done
          curl -sf http://localhost:8080/api/health/ready || {
            echo "Backend health check failed"
            docker compose -f docker-compose.e2e.yml logs
            exit 1
          }

      - name: "Run Playwright tests"
        working-directory: e2e
        run: npx playwright test
        env:
          E2E_ADMIN_USERNAME: ${{ env.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
          E2E_API_URL: ${{ env.E2E_API_URL }}

      - name: "Upload test report"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: "Upload traces on failure"
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

      - name: "Dump compose logs on failure"
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs

      - name: "Tear down compose stack"
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
