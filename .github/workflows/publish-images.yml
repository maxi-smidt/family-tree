name: Publish Images

# Reusable: build, Trivy-scan, and (optionally) push the backend/frontend
# images. Called by check-build.yml on push/tag, and by release.yml once its
# release PR has merged, with the version about to be tagged.

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit/branch/tag to check out and build. Defaults to the ref that
          triggered the caller.
        type: string
        default: ""
        required: false
      version:
        description: "Image version tag. Falls back to a git-ref-derived value when empty."
        type: string
        required: false
        default: ""
      revision:
        description: "Commit SHA baked into image metadata. Defaults to the checked-out SHA."
        type: string
        required: false
        default: ""
      push:
        description: "Push the built images to GHCR. false performs a scan-only dry run."
        type: boolean
        default: true
        required: false
      tag-latest:
        description: "Also move the `latest` tag to this build."
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  packages: write
  # Keyless OIDC signing for the provenance/SBOM attestations below — no key
  # to manage or rotate.
  id-token: write
  attestations: write

jobs:
  images:
    name: "Build & push ${{ matrix.service }} image"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-images-${{ github.ref }}-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            context: .
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: "Resolve build metadata"
        id: build-meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            REF_NAME="${GITHUB_REF_NAME//\//-}"
            VERSION="${REF_NAME}-${SHORT_SHA}"
          else
            VERSION="manual-${SHORT_SHA}"
          fi

          REVISION="${{ inputs.revision }}"
          if [ -z "$REVISION" ]; then
            REVISION="$GITHUB_SHA"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: "Log in to GHCR"
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No type=sha tag: nothing pulls a commit-pinned image (branch tags
      # cover "current main", semver + latest cover releases), and it was
      # the single biggest source of untagged/unreferenced clutter on the
      # GHCR package pages (#909).
      - name: "Docker metadata"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=v${{ steps.build-meta.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.tag-latest }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      # Build into the local Docker daemon first so Trivy can scan the image
      # before anything is pushed. The push step below is a pure cache hit.
      - name: "Build for scanning"
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: scan-target/${{ matrix.service }}:ci
          build-args: |
            APP_VERSION=${{ steps.build-meta.outputs.version }}
            APP_REVISION=${{ steps.build-meta.outputs.revision }}
            APP_BUILD_DATE=${{ steps.build-meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Report vulnerabilities (Trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target/${{ matrix.service }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: "Gate on fixable CRITICAL vulnerabilities (Trivy)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target/${{ matrix.service }}:ci
          format: table
          severity: CRITICAL
          # Only fixable CRITICALs block the publish; a CVE with no patched
          # package available yet shouldn't stall releases.
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: "Build and push"
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build-meta.outputs.version }}
            APP_REVISION=${{ steps.build-meta.outputs.revision }}
            APP_BUILD_DATE=${{ steps.build-meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless-signed via the runner's OIDC identity, bound to the exact
      # digest just pushed, and attached to the image as an OCI referrer so
      # `gh attestation verify` works against the published tag later.
      - name: "Attest build provenance"
        if: inputs.push
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: "Generate SBOM"
        if: inputs.push
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-${{ matrix.service }}@${{ steps.push.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json
          skip-setup-trivy: true

      # actions/attest-sbom is deprecated in favor of the generic
      # actions/attest action with sbom-path set (same predicate, no
      # deprecation warning on every release run).
      - name: "Attest SBOM"
        if: inputs.push
        uses: actions/attest@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.service }}.cdx.json
          push-to-registry: true

      # Also kept as a plain file so release.yml can attach it to the GitHub
      # Release as a downloadable asset, and so it can be rescanned offline
      # later (`trivy sbom sbom-<service>.cdx.json`) against a fresh advisory
      # database — the whole point of keeping one.
      - name: "Upload SBOM artifact"
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 90
