name: Build and Publish Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  images:
    name: "Build & push ${{ matrix.service }} image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          # Always move the "latest" tag to the most recent build so the
          # production compose (which references :latest) can pull it.
          flavor: latest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build into the local Docker daemon first so Trivy can scan the image
      # before anything is pushed. The push step below is a pure cache hit.
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: scan-target/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: scan-target/${{ matrix.service }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Gate on fixable CRITICAL vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: scan-target/${{ matrix.service }}:ci
          format: table
          severity: CRITICAL
          # Only fixable CRITICALs block the publish; a CVE with no patched
          # package available yet shouldn't stall releases.
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
