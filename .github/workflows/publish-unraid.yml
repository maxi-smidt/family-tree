name: Publish Unraid Templates

on:
  push:
    branches:
      - main
    paths:
      - 'unraid/templates/**'
      - '.github/workflows/publish-unraid.yml'
  workflow_dispatch:

jobs:
  publish-unraid:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish to Unraid branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan unraid-templates
          git rm -rf .
          cp -r unraid/templates/* .
          git add *.xml
          git commit -m "chore: publish Unraid templates" || echo "No changes to commit"
          git push origin unraid-templates --force
