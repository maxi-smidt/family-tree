name: Release

# Manual release pipeline: verify -> bump -> PR -> checks + E2E (via the
# normal PR trigger) -> merge -> publish candidate images -> rehearse the
# packaged upgrade + smoke-test -> promote tags -> tag + GitHub Release.
#
# The release commit lands on `main` through a normal PR/squash-merge rather
# than a direct push, because the "Main" ruleset requires every change to go
# through a PR and has no bypass actors configured. required_approving_review
# _count is 0 and no CODEOWNERS file exists, so the PR merges automatically
# once its checks (the existing check-build.yml + e2e.yml, triggered exactly
# as they are for any other PR) pass — no bypass needed.
#
# Token split — this matters, do not collapse it into one token:
#
#   * The PR is opened with RELEASE_PAT. A PR authored by github-actions[bot]
#     has its workflow runs parked at `action_required` awaiting manual
#     approval, so no checks ever report and the `land` job below times out
#     on an empty check list. A PAT belonging to a repo contributor is not
#     subject to that gate.
#   * Everything else — including the merge — stays on GITHUB_TOKEN. A push
#     produced by GITHUB_TOKEN does not trigger other workflow runs, which is
#     exactly what we want: check-build.yml publishes images on every push to
#     main, so merging with the PAT would race a second publish against the
#     `publish-candidate` job below. That same property is why
#     publish-images.yml is called directly here instead of being left to
#     main's push trigger.
#
# Promotion order (#1022): `publish-candidate` pushes the built images under
# a non-discoverable `<version>-rehearsal` tag only — no `latest`, no semver
# tag, no GitHub Release yet. `packaged-upgrade-rehearsal` and `smoke-test`
# then exercise that exact candidate. Only once both pass does
# `promote-images` retarget the semver + `latest` tags onto the already-
# rehearsed digest (no rebuild), and `github-release` creates the Release. A
# failure anywhere before `promote-images` leaves no version tag, no
# `latest`, and no Release for a self-hoster to stumble into.
#
# See the epic's constraint note (#899, #902).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version segment to bump"
        type: choice
        options: [patch, minor, major]
        required: true
      dry_run:
        description: "Compute the version and notes only — no commit, PR, or publish"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: "Bump version & open release PR"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.bump.outputs.version }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: "Require main"
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Releases can only be dispatched from main (got ${{ github.ref }})."
            exit 1
          fi

      - name: "Require RELEASE_PAT"
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "RELEASE_PAT is not set. A release PR opened by"
            echo "github-actions[bot] has its checks parked awaiting manual"
            echo "approval, which stalls the 'land' job — so the PR must be"
            echo "opened with a contributor PAT. Add a fine-grained token with"
            echo "Contents: read/write and Pull requests: read/write as the"
            echo "RELEASE_PAT repository secret."
            exit 1
          fi

      - name: "Checkout main"
        uses: actions/checkout@v7
        with:
          ref: main
          # Full history + tags: git-cliff needs to find the previous tag.
          fetch-depth: 0

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: "Bump version files"
        id: bump
        working-directory: frontend
        run: |
          node scripts/bump-version.js ${{ inputs.bump }}
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: "Generate release notes"
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ steps.bump.outputs.version }} --strip header -o RELEASE_NOTES.md

      - name: "Write dry-run summary"
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Dry run: v${{ steps.bump.outputs.version }}"
            echo
            echo "No commit, PR, or publish happened."
            echo
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: the branch name deliberately avoids the `release/*` namespace.
      # The "release protection" ruleset covers `refs/heads/release/*` with
      # deletion + non-fast-forward rules and an empty bypass list, which is
      # right for the long-lived `release/v1.7`-style maintenance branches but
      # would pin these throwaway ones in place forever: they would survive
      # delete_branch_on_merge, and a retry of the same version could neither
      # force-push nor delete the leftover branch.
      - name: "Commit and open release PR"
        if: ${{ !inputs.dry_run }}
        id: pr
        env:
          # Not github.token — see the token split note at the top of the file.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          BRANCH="chore/release-v${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add frontend/package.json frontend/package-lock.json backend/pyproject.toml backend/uv.lock
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(release): v${{ steps.bump.outputs.version }}" \
            --body-file RELEASE_NOTES.md)
          echo "pr_number=$(basename "$PR_URL")" >> "$GITHUB_OUTPUT"

      - name: "Upload release notes"
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 5

  land:
    name: "Wait for checks & merge release PR"
    needs: bump
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      # PR checks include the normal required checks (Check Application Build,
      # Check Version Bump, Check for Missing i18n Keys) plus the non-required
      # ones this release still needs to gate on — Playwright E2E and the
      # PR-title lint on this job's own generated title.
      #
      # `gh pr checks --watch` waits for known checks to finish, but exits 1
      # immediately with "no checks reported" when none have registered yet —
      # checks can take a few seconds to appear after the PR is opened. Poll
      # for the first check to show up before handing off to --watch.
      - name: "Wait for PR checks"
        run: |
          PR="${{ needs.bump.outputs.pr_number }}"
          for i in $(seq 1 30); do
            if [ -n "$(gh pr checks "$PR" --json name -q '.[].name' 2>/dev/null)" ]; then
              echo "Checks registered after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "No checks registered on PR #${PR} after 5 minutes."
              echo "If the runs are parked at 'action_required', the PR author"
              echo "tripped a workflow-approval gate — see the token split note"
              echo "in this workflow."
              gh run list --branch "chore/release-v${{ needs.bump.outputs.version }}" \
                --limit 10 || true
              exit 1
            fi
            echo "  attempt $i/30 — no checks yet, waiting 10s"
            sleep 10
          done
          gh pr checks "$PR" --watch --fail-fast

      - name: "Squash-merge release PR"
        id: merge
        run: |
          gh pr merge "${{ needs.bump.outputs.pr_number }}" --squash
          echo "sha=$(gh api repos/${{ github.repository }}/git/ref/heads/main -q .object.sha)" >> "$GITHUB_OUTPUT"

  publish-candidate:
    name: "Publish candidate images"
    needs: [bump, land]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/publish-images.yml
    with:
      ref: ${{ needs.land.outputs.sha }}
      version: ${{ needs.bump.outputs.version }}
      revision: ${{ needs.land.outputs.sha }}
      push: true
      tag-latest: false
      tag-version: false
      extra-tag: "${{ needs.bump.outputs.version }}-rehearsal"
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # Proves the exact candidate image can carry out the v1 -> v2 data
  # conversion for real (#1022) — every other migration test either runs
  # in-process against source (tests/test_migration_postgres.py) or against a
  # fresh database only (smoke-test below). Deliberately scoped to one
  # representative fixture at the latest v1 revision; the broader
  # same-owner/cross-owner/dangling/asymmetric matrix already has coverage in
  # tests/test_migration_postgres.py, and a second fixture at the oldest
  # supported revision, an encrypted-backup fixture, and authenticated/public
  # UI flows (owned by the parallel #992 gate) are intentionally left for
  # follow-up work rather than growing this one job further.
  packaged-upgrade-rehearsal:
    name: "Rehearse the packaged v1 -> v2 upgrade"
    needs: [bump, land, publish-candidate]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_IMAGE_TAG: "${{ needs.bump.outputs.version }}-rehearsal"
      SECRET_KEY: rehearsal-not-for-production-use-only-0123456789abcdef
      POSTGRES_HOST: db
      FIRST_ADMIN_USERNAME: rehearsal-admin
      FIRST_ADMIN_PASSWORD: rehearsal-admin-password
      # Deliberately not DATABASE_URL: docker-compose.prod.yml forwards that
      # name straight into the backend container's environment, and this
      # value (localhost:5433, reachable only from the runner) would break
      # the container's own connection to the `db` service. Scripts run on
      # the runner use this one instead.
      REHEARSAL_DATABASE_URL: postgresql+psycopg2://familytree:familytree@localhost:5433/familytree
      REHEARSAL_BASE_URL: http://localhost:8001
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.land.outputs.sha }}

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: "Install backend dependencies"
        working-directory: backend
        run: uv sync --frozen

      # Same UID-1000 bind-mount concern as smoke-test below.
      - name: "Pre-create bind mounts owned by the container user"
        run: |
          mkdir -p appdata/backend data
          sudo chown -R 1000:1000 appdata data

      - name: "Start a blank database"
        run: docker compose -f docker-compose.prod.yml -f docker-compose.rehearsal.yml up -d db

      - name: "Seed a representative v1 fixture"
        working-directory: backend
        run: |
          uv run python -m scripts.seed_v1_fixture \
            --database-url "$REHEARSAL_DATABASE_URL" \
            --manifest-out ../manifest.json

      - name: "Pull the candidate image and start the backend against the fixture"
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.rehearsal.yml pull backend
          docker compose -f docker-compose.prod.yml -f docker-compose.rehearsal.yml up -d backend

      - name: "Wait for the packaged migration to complete"
        working-directory: backend
        run: |
          uv run python -m scripts.verify_upgrade_rehearsal wait-for-migration \
            --base-url "$REHEARSAL_BASE_URL" --timeout 300

      - name: "Check post-migration data"
        working-directory: backend
        run: |
          uv run python -m scripts.verify_upgrade_rehearsal check-postconditions \
            --database-url "$REHEARSAL_DATABASE_URL" --manifest ../manifest.json --expect post_conversion

      - name: "Restart and confirm the conversion does not re-run"
        run: docker compose -f docker-compose.prod.yml -f docker-compose.rehearsal.yml restart backend

      - name: "Wait for readiness after restart"
        run: |
          for i in $(seq 1 30); do
            curl -sf "$REHEARSAL_BASE_URL/api/health/ready" > /dev/null 2>&1 && break
            sleep 2
          done
          curl -sf "$REHEARSAL_BASE_URL/api/health/ready"

      - name: "Assert the restart was idempotent"
        working-directory: backend
        run: uv run python -m scripts.verify_upgrade_rehearsal assert-single-run --database-url "$REHEARSAL_DATABASE_URL"

      - name: "Locate the automatic pre-migration backup"
        run: |
          BACKUP_FILE=$(sudo find appdata/backend/backups -maxdepth 1 -name '*.ftbackup')
          if [ -z "$BACKUP_FILE" ] || [ "$(echo "$BACKUP_FILE" | wc -l)" -ne 1 ]; then
            echo "Expected exactly one pre-migration backup, found: $BACKUP_FILE"
            exit 1
          fi
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"

      - name: "Copy the backup out and tear down the upgraded instance"
        run: |
          sudo cp "$BACKUP_FILE" /tmp/pre_migration.ftbackup
          sudo chown "$(id -u):$(id -g)" /tmp/pre_migration.ftbackup
          docker compose -f docker-compose.prod.yml -f docker-compose.rehearsal.yml down -v
          sudo rm -rf appdata data

      # Restore-only rollback (docs/UPGRADE_V2.md §8, docs/OPERATIONS.md
      # "If the conversion fails"): the automatic backup is taken right
      # after the schema migration but *before* the orchestrator's
      # CONVERTING phase, so restoring it into a blank target must reproduce
      # the pre-conversion shape, not the converged one. "Blank" here means
      # schema-migrated but otherwise empty — starting the backend
      # normally also seeds the admin user (app.db.init_db.init_db()),
      # which the restore's own emptiness check rejects — so this runs the
      # candidate image's migration and the restore CLI as one-off
      # commands instead of through the normal container entrypoint.
      - name: "Restore into a blank target"
        run: |
          mkdir -p appdata/backend/backups data
          cp /tmp/pre_migration.ftbackup appdata/backend/backups/pre_migration.ftbackup
          sudo chown -R 1000:1000 appdata data
          docker compose -f docker-compose.prod.yml -f docker-compose.rehearsal.yml up -d db
          docker compose -f docker-compose.prod.yml -f docker-compose.rehearsal.yml run --rm backend \
            alembic upgrade head
          docker compose -f docker-compose.prod.yml -f docker-compose.rehearsal.yml run --rm backend \
            python -m app.services.system.backups.restore_backup /appdata/backups/pre_migration.ftbackup

      - name: "Check restored data matches the pre-conversion shape"
        working-directory: backend
        run: |
          uv run python -m scripts.verify_upgrade_rehearsal check-postconditions \
            --database-url "$REHEARSAL_DATABASE_URL" --manifest ../manifest.json --expect pre_conversion

      - name: "Dump compose logs on failure"
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.rehearsal.yml logs

      - name: "Tear down"
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.rehearsal.yml down -v

  # Everything above this point can pass while the *published* artifact is
  # still broken: release-e2e builds from source with different build args
  # than publish-images pushes. This is the job that pulls the actual
  # candidate GHCR image against a fresh database — packaged-upgrade-
  # rehearsal above covers the v1-upgrade path; this covers a clean install.
  smoke-test:
    name: "Smoke-test the candidate images"
    needs: [bump, land, publish-candidate]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_IMAGE_TAG: "${{ needs.bump.outputs.version }}-rehearsal"
      SECRET_KEY: smoke-test-not-for-production-use-only
      POSTGRES_HOST: db
      FIRST_ADMIN_USERNAME: e2e-admin
      FIRST_ADMIN_PASSWORD: e2e-admin-password
      E2E_ADMIN_USERNAME: e2e-admin
      E2E_ADMIN_PASSWORD: e2e-admin-password
      E2E_BASE_URL: http://localhost:8080
      E2E_API_URL: http://localhost:8080/api
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.land.outputs.sha }}

      # docker-compose.prod.yml bind-mounts host paths into the backend, which
      # runs as UID 1000 (backend/Dockerfile). An operator creates those
      # directories themselves — on a typical Linux host that yields UID 1000
      # and everything matches. CI does not, so Docker auto-creates the bind
      # source as root:root and the container dies on its first write:
      # "PermissionError: [Errno 13] Permission denied: '/appdata/logs'".
      # Paths mirror the compose defaults (APP_DATA_PATH/DATA_PATH are unset
      # for this job, so ./appdata/backend and ./data apply).
      - name: "Pre-create bind mounts owned by the container user"
        run: |
          mkdir -p appdata/backend data
          sudo chown -R 1000:1000 appdata data

      - name: "Pull candidate images and start the stack"
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.smoke.yml pull
          docker compose -f docker-compose.prod.yml -f docker-compose.smoke.yml up -d

      - name: "Wait for stack to be healthy"
        run: |
          echo "Waiting for frontend to be reachable..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Stack is up after ${i} attempts"
              break
            fi
            echo "  attempt $i/30 — waiting 5s"
            sleep 5
          done
          curl -sf http://localhost:8080/api/health/ready || {
            echo "Backend health check failed — the candidate image likely could not migrate a fresh database."
            docker compose -f docker-compose.prod.yml -f docker-compose.smoke.yml logs
            exit 1
          }

      - name: "Assert the reported version matches the release"
        run: |
          REPORTED=$(curl -sf http://localhost:8080/api/health | jq -r .version)
          echo "Reported version: $REPORTED (expected ${{ needs.bump.outputs.version }})"
          if [ "$REPORTED" != "${{ needs.bump.outputs.version }}" ]; then
            echo "Candidate image reports version '$REPORTED', expected '${{ needs.bump.outputs.version }}'."
            exit 1
          fi

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: "Install dependencies"
        working-directory: e2e
        run: npm ci

      - name: "Install Playwright browsers"
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # A minimal subset (login, create a tree, see it in the UI), not the
      # full suite — this exists to catch packaging failures, not to re-run
      # feature tests that already passed against a from-source build.
      - name: "Run smoke subset"
        working-directory: e2e
        run: npx playwright test smoke.spec.ts

      - name: "Upload test report"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-smoke-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: "Dump compose logs on failure"
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.smoke.yml logs

      - name: "Tear down"
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.smoke.yml down -v

  promote-images:
    name: "Promote tags on the rehearsed candidate"
    needs: [bump, land, publish-candidate, packaged-upgrade-rehearsal, smoke-test]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: "Log in to GHCR"
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      # Points the semver + latest tags at the exact manifest that was just
      # rehearsed — no rebuild, so what gets promoted is provably what was
      # tested, not a fresh build that merely used the same source.
      - name: "Retarget version + latest tags"
        run: |
          for service in backend frontend; do
            IMAGE="ghcr.io/${{ github.repository }}-${service}"
            docker buildx imagetools create \
              --tag "${IMAGE}:${{ needs.bump.outputs.version }}" \
              --tag "${IMAGE}:latest" \
              "${IMAGE}:${{ needs.bump.outputs.version }}-rehearsal"
          done

  github-release:
    name: "Tag and create GitHub Release"
    needs: [bump, land, promote-images]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: "Checkout release commit"
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.land.outputs.sha }}

      - name: "Download release notes"
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: "Download SBOMs"
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          merge-multiple: true

      - name: "Create GitHub Release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.bump.outputs.version }}" \
            --target "${{ needs.land.outputs.sha }}" \
            --title "v${{ needs.bump.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            docker-compose.prod.yml \
            .env.example \
            sbom-*.cdx.json
