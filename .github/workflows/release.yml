name: Release

# Manual release pipeline: verify -> bump -> PR -> checks + E2E (via the
# normal PR trigger) -> merge -> publish images -> tag + GitHub Release.
#
# The release commit lands on `main` through a normal PR/squash-merge rather
# than a direct push, because the "Main" ruleset requires every change to go
# through a PR and has no bypass actors configured. required_approving_review
# _count is 0 and no CODEOWNERS file exists, so the PR merges automatically
# once its checks (the existing check-build.yml + e2e.yml, triggered exactly
# as they are for any other PR) pass — no bypass needed.
#
# Token split — this matters, do not collapse it into one token:
#
#   * The PR is opened with RELEASE_PAT. A PR authored by github-actions[bot]
#     has its workflow runs parked at `action_required` awaiting manual
#     approval, so no checks ever report and the `land` job below times out
#     on an empty check list. A PAT belonging to a repo contributor is not
#     subject to that gate.
#   * Everything else — including the merge — stays on GITHUB_TOKEN. A push
#     produced by GITHUB_TOKEN does not trigger other workflow runs, which is
#     exactly what we want: check-build.yml publishes images on every push to
#     main, so merging with the PAT would race a second publish against the
#     `publish` job below. That same property is why publish-images.yml is
#     called directly here instead of being left to main's push trigger.
#
# See the epic's constraint note (#899, #902).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version segment to bump"
        type: choice
        options: [patch, minor, major]
        required: true
      dry_run:
        description: "Compute the version and notes only — no commit, PR, or publish"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: "Bump version & open release PR"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.bump.outputs.version }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: "Require main"
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Releases can only be dispatched from main (got ${{ github.ref }})."
            exit 1
          fi

      - name: "Require RELEASE_PAT"
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "RELEASE_PAT is not set. A release PR opened by"
            echo "github-actions[bot] has its checks parked awaiting manual"
            echo "approval, which stalls the 'land' job — so the PR must be"
            echo "opened with a contributor PAT. Add a fine-grained token with"
            echo "Contents: read/write and Pull requests: read/write as the"
            echo "RELEASE_PAT repository secret."
            exit 1
          fi

      - name: "Checkout main"
        uses: actions/checkout@v7
        with:
          ref: main
          # Full history + tags: git-cliff needs to find the previous tag.
          fetch-depth: 0

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: "Bump version files"
        id: bump
        working-directory: frontend
        run: |
          node scripts/bump-version.js ${{ inputs.bump }}
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: "Generate release notes"
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ steps.bump.outputs.version }} --strip header -o RELEASE_NOTES.md

      - name: "Write dry-run summary"
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Dry run: v${{ steps.bump.outputs.version }}"
            echo
            echo "No commit, PR, or publish happened."
            echo
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: the branch name deliberately avoids the `release/*` namespace.
      # The "release protection" ruleset covers `refs/heads/release/*` with
      # deletion + non-fast-forward rules and an empty bypass list, which is
      # right for the long-lived `release/v1.7`-style maintenance branches but
      # would pin these throwaway ones in place forever: they would survive
      # delete_branch_on_merge, and a retry of the same version could neither
      # force-push nor delete the leftover branch.
      - name: "Commit and open release PR"
        if: ${{ !inputs.dry_run }}
        id: pr
        env:
          # Not github.token — see the token split note at the top of the file.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          BRANCH="chore/release-v${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add frontend/package.json frontend/package-lock.json backend/pyproject.toml backend/uv.lock
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(release): v${{ steps.bump.outputs.version }}" \
            --body-file RELEASE_NOTES.md)
          echo "pr_number=$(basename "$PR_URL")" >> "$GITHUB_OUTPUT"

      - name: "Upload release notes"
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 5

  land:
    name: "Wait for checks & merge release PR"
    needs: bump
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      # PR checks include the normal required checks (Check Application Build,
      # Check Version Bump, Check for Missing i18n Keys) plus the non-required
      # ones this release still needs to gate on — Playwright E2E and the
      # PR-title lint on this job's own generated title.
      #
      # `gh pr checks --watch` waits for known checks to finish, but exits 1
      # immediately with "no checks reported" when none have registered yet —
      # checks can take a few seconds to appear after the PR is opened. Poll
      # for the first check to show up before handing off to --watch.
      - name: "Wait for PR checks"
        run: |
          PR="${{ needs.bump.outputs.pr_number }}"
          for i in $(seq 1 30); do
            if [ -n "$(gh pr checks "$PR" --json name -q '.[].name' 2>/dev/null)" ]; then
              echo "Checks registered after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "No checks registered on PR #${PR} after 5 minutes."
              echo "If the runs are parked at 'action_required', the PR author"
              echo "tripped a workflow-approval gate — see the token split note"
              echo "in this workflow."
              gh run list --branch "chore/release-v${{ needs.bump.outputs.version }}" \
                --limit 10 || true
              exit 1
            fi
            echo "  attempt $i/30 — no checks yet, waiting 10s"
            sleep 10
          done
          gh pr checks "$PR" --watch --fail-fast

      - name: "Squash-merge release PR"
        id: merge
        run: |
          gh pr merge "${{ needs.bump.outputs.pr_number }}" --squash
          echo "sha=$(gh api repos/${{ github.repository }}/git/ref/heads/main -q .object.sha)" >> "$GITHUB_OUTPUT"

  publish:
    name: "Publish images"
    needs: [bump, land]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/publish-images.yml
    with:
      ref: ${{ needs.land.outputs.sha }}
      version: ${{ needs.bump.outputs.version }}
      revision: ${{ needs.land.outputs.sha }}
      push: true
      tag-latest: true
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  github-release:
    name: "Tag and create GitHub Release"
    needs: [bump, land, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: "Checkout release commit"
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.land.outputs.sha }}

      - name: "Download release notes"
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: "Download SBOMs"
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          merge-multiple: true

      - name: "Create GitHub Release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.bump.outputs.version }}" \
            --target "${{ needs.land.outputs.sha }}" \
            --title "v${{ needs.bump.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            docker-compose.prod.yml \
            .env.example \
            sbom-*.cdx.json

  # Everything above this point can pass while the *published* artifact is
  # still broken: release-e2e builds from source with different build args
  # than publish-images pushes, and no prior job pulls the actual GHCR image.
  # This is the one job that does — a failure here means self-hosters would
  # pull a release that cannot come up.
  smoke-test:
    name: "Smoke-test published images"
    needs: [bump, land, github-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_IMAGE_TAG: ${{ needs.bump.outputs.version }}
      SECRET_KEY: smoke-test-not-for-production-use-only
      POSTGRES_HOST: db
      FIRST_ADMIN_USERNAME: e2e-admin
      FIRST_ADMIN_PASSWORD: e2e-admin-password
      E2E_ADMIN_USERNAME: e2e-admin
      E2E_ADMIN_PASSWORD: e2e-admin-password
      E2E_BASE_URL: http://localhost:8080
      E2E_API_URL: http://localhost:8080/api
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.land.outputs.sha }}

      # docker-compose.prod.yml bind-mounts host paths into the backend, which
      # runs as UID 1000 (backend/Dockerfile). An operator creates those
      # directories themselves — on a typical Linux host that yields UID 1000
      # and everything matches. CI does not, so Docker auto-creates the bind
      # source as root:root and the container dies on its first write:
      # "PermissionError: [Errno 13] Permission denied: '/appdata/logs'".
      # Paths mirror the compose defaults (APP_DATA_PATH/DATA_PATH are unset
      # for this job, so ./appdata/backend and ./data apply).
      - name: "Pre-create bind mounts owned by the container user"
        run: |
          mkdir -p appdata/backend data
          sudo chown -R 1000:1000 appdata data

      - name: "Pull published images and start the stack"
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.smoke.yml pull
          docker compose -f docker-compose.prod.yml -f docker-compose.smoke.yml up -d

      - name: "Wait for stack to be healthy"
        run: |
          echo "Waiting for frontend to be reachable..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Stack is up after ${i} attempts"
              break
            fi
            echo "  attempt $i/30 — waiting 5s"
            sleep 5
          done
          curl -sf http://localhost:8080/api/health/ready || {
            echo "Backend health check failed — the published image likely could not migrate a fresh database."
            docker compose -f docker-compose.prod.yml -f docker-compose.smoke.yml logs
            exit 1
          }

      - name: "Assert the reported version matches the release"
        run: |
          REPORTED=$(curl -sf http://localhost:8080/api/health | jq -r .version)
          echo "Reported version: $REPORTED (expected ${{ needs.bump.outputs.version }})"
          if [ "$REPORTED" != "${{ needs.bump.outputs.version }}" ]; then
            echo "Published image reports version '$REPORTED', expected '${{ needs.bump.outputs.version }}'."
            exit 1
          fi

      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: "Install dependencies"
        working-directory: e2e
        run: npm ci

      - name: "Install Playwright browsers"
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # A minimal subset (login, create a tree, see it in the UI), not the
      # full suite — this exists to catch packaging failures, not to re-run
      # feature tests that already passed against a from-source build.
      - name: "Run smoke subset"
        working-directory: e2e
        run: npx playwright test smoke.spec.ts

      - name: "Upload test report"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-smoke-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: "Dump compose logs on failure"
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.smoke.yml logs

      - name: "Tear down"
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.smoke.yml down -v

  # Images are already pushed and the release already exists by this point —
  # there is nothing left to unpublish. Flag it instead: mark the release as
  # a prerelease so it stays visible (self-hosters can still investigate the
  # published assets) but is clearly not something to pin APP_IMAGE_TAG to.
  flag-release-on-smoke-failure:
    name: "Flag release as prerelease on smoke-test failure"
    needs: [bump, github-release, smoke-test]
    if: ${{ !inputs.dry_run && failure() && needs.github-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: "Mark release as prerelease"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TAG="v${{ needs.bump.outputs.version }}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body > notes.md
          {
            echo
            echo
            echo "⚠️ **Smoke test failed**: the published images could not come up and migrate a fresh database (or served the wrong version). Investigate the [smoke-test job]($RUN_URL) before relying on this release."
          } >> notes.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease --notes-file notes.md
