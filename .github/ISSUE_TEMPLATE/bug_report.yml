name: 🐛 Bug Report
description: Report a bug or unexpected behavior in the Family Tree application
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help GitHub Copilot and maintainers understand and fix the issue.
        
        💡 **Tip for Copilot**: The more specific you are about file paths, error messages, and expected behavior, the better Copilot can assist in fixing the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: |
        Example: When I try to add a new family member, the dialog closes but the member doesn't appear in the tree view.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Open the Family Tree application
        2. Click on 'Add Member' button
        3. Fill in the member details (Name: John Doe, Birth Date: 1990-01-01)
        4. Click 'Save'
        5. Notice that the dialog closes but no member appears
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: The new member should appear in the tree view after saving.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: The dialog closes but the member is not added to the tree.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide information about your environment
      placeholder: |
        - OS: [e.g., Windows 11, macOS 14.0, Ubuntu 22.04]
        - App Version: [e.g., 0.1.14 - found in About dialog or package.json]
        - Database: [e.g., new database, imported database]
      value: |
        - OS: 
        - App Version: 
        - Database: 
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Messages / Console Logs
      description: |
        Include any error messages, console logs, or stack traces. 
        💡 For Copilot: Console logs can be found in DevTools (Ctrl+Shift+I / Cmd+Option+I in dev mode)
      placeholder: |
        Paste error messages or logs here. Include:
        - Browser console errors (F12 DevTools)
        - Rust/Tauri logs from terminal (if running in dev mode)
      render: shell

  - type: textarea
    id: files
    attributes:
      label: Relevant Files/Components
      description: |
        If you know which files or components might be affected, list them here.
        💡 For Copilot: This helps identify where to look for the bug.
      placeholder: |
        Examples:
        - src/components/shared/dialog/MemberDetailDialog.tsx
        - src/hooks/useFamilyStore.ts (addMember action)
        - src/services/DatabaseService.ts

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos
      description: |
        Add screenshots or videos to help explain the problem.
        Drag and drop images directly into this field.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (e.g., when did it start happening, does it happen with specific data?)

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have included all relevant information above
          required: true
        - label: I am using the latest version of the application (or have specified my version)
          required: false
