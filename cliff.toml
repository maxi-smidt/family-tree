# git-cliff configuration — generates GitHub Release notes from Conventional
# Commit history instead of hand-maintained bullets. There is no CHANGELOG.md
# in this repo; generated notes live only on the GitHub Releases page.
#
# Usage (see docs in AGENTS.md "PR titles & changelog"), invoked by
# release.yml:
#   git cliff --unreleased --tag "v$NEW" --strip header -o RELEASE_NOTES.md
#
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format is based on
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this project
adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Releases are cut from `vX.Y.Z` Git tags; pushing a tag publishes the matching
Docker images to GHCR (see [docs/OPERATIONS.md](docs/OPERATIONS.md)).
"""
body = """
{%- if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | upper_first }}
{%- if commit.body %}
  {{ commit.body | trim | indent(prefix="  ") }}
{%- endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = """
{% if previous.version and version %}\
    **Full diff:** [`{{ previous.version }}...{{ version }}`](https://github.com/maxi-smidt/family-tree/compare/{{ previous.version }}...{{ version }})
{% endif %}\
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

commit_preprocessors = [
    # Link bare "(#123)" PR references at the end of a subject to the PR.
    { pattern = '(?m)\(#(\d+)\)$', replace = "([#$1](https://github.com/maxi-smidt/family-tree/pull/$1))" },
]

commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^security", group = "Security" },
    # Internal-only, never user-facing — excluded from generated notes.
    { message = "^chore", skip = true },
    { message = "^typing", skip = true },
    { message = "^test", skip = true },
    { message = "^docs", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
    { message = "^style", skip = true },
    # Anything else (non-conforming subject) — surface it rather than
    # silently dropping it, so a missed `feat:`/`fix:` prefix is still seen.
    { message = ".*", group = "Other" },
]
