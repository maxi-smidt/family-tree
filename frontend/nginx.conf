server {
    listen 80;
    server_name _;

    # Allow reasonably large uploads (member photos, gallery images, imports).
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # API and uploaded media are proxied to the FastAPI backend so the SPA can
    # use same-origin relative URLs (e.g. /api/media/...).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every other route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
