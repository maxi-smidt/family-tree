server {
    listen 8080;
    server_name _;

    # Allow reasonably large uploads (member photos, gallery images, imports).
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    #
    # Content-Security-Policy notes:
    #   script-src 'self'          — Vite bundles everything; no external scripts.
    #   style-src  'self' 'unsafe-inline' — Radix UI and React Flow set inline
    #              style="" attributes for dynamic positioning; nonces would
    #              require per-request SSR which nginx cannot provide.
    #   img-src    blob:           — useMediaUrl fetches /api/media/* with the
    #              Bearer token and hands the browser a blob: URL.
    #              data:           — small data URIs used by React Flow edges/markers.
    #              tile.openstreetmap.org / *.tile.openstreetmap.org — Leaflet map
    #              tiles in the Map view are loaded directly from the OSM tile
    #              server. The apex domain is listed explicitly because the
    #              wildcard alone does not match it (see #471); the wildcard is
    #              kept for any remaining lettered-subdomain references.
    #   connect-src 'self'         — all API calls are same-origin via the /api proxy.
    #   font-src 'self'            — fonts are bundled by Vite; no CDN calls.
    #   frame-ancestors 'none'     — blocks embedding in iframes (clickjacking).
    #   base-uri 'self'            — prevents <base> tag injection.
    #   form-action 'self'         — prevents form POST exfiltration to third parties.
    #   object-src 'none'          — no plugin content (Flash, Java applets).
    #
    # Authentik/OIDC: the OAuth redirect is browser navigation (not a fetch),
    # so it is not constrained by connect-src; frame-ancestors 'none' has no
    # effect on top-level navigations either.
    #
    # Vite dev server: this nginx config only runs in production. The dev server
    # does not apply these headers; HMR websockets and inline scripts work as
    # normal in development.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';"
        always;

    # Belt-and-suspenders clickjacking protection for older browsers that do not
    # understand frame-ancestors.
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing — stops browsers from interpreting files as a
    # different type than declared.
    add_header X-Content-Type-Options "nosniff" always;

    # Limit the Referer header to origin-only for cross-origin requests so that
    # URL fragments (e.g. #token=...) are never sent to third parties.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable access to sensitive device APIs that this app never uses.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # ─────────────────────────────────────────────────────────────────────────

    # SSE endpoint — buffering must be disabled for the stream to flow.
    location /api/sse/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # API and uploaded media are proxied to the FastAPI backend so the SPA can
    # use same-origin relative URLs (e.g. /api/media/...).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite-hashed static assets: safe to cache for 1 year because filenames
    # are content-addressed (e.g. main.a1b2c3d4.js).
    # Re-declare ALL security headers — nginx resets add_header inheritance
    # whenever any add_header appears in a child block.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';"
            always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # SPA fallback: every other route serves index.html.
    # no-cache ensures browsers revalidate index.html so deploys roll out
    # immediately (ETag / Last-Modified still allow conditional 304 responses).
    # Re-declare ALL security headers — same nginx inheritance reason as above.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';"
            always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
